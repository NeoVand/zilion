<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zilion logo">
  <defs>
    <linearGradient id="zg" x1="40" y1="40" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB020"/>
      <stop offset="0.5" stop-color="#FF4D6D"/>
      <stop offset="1" stop-color="#8A5CFF"/>
    </linearGradient>
    <linearGradient id="zg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4D6D"/>
      <stop offset="1" stop-color="#8A5CFF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- chip body -->
  <rect x="24" y="24" width="272" height="272" rx="52" fill="#14141B"/>
  <rect x="24" y="24" width="272" height="272" rx="52" fill="none" stroke="url(#zg)" stroke-width="3" opacity="0.55"/>

  <!-- chip pins -->
  <g fill="url(#zg)" opacity="0.55">
    <rect x="70" y="8" width="14" height="20" rx="3"/><rect x="118" y="8" width="14" height="20" rx="3"/>
    <rect x="188" y="8" width="14" height="20" rx="3"/><rect x="236" y="8" width="14" height="20" rx="3"/>
    <rect x="70" y="292" width="14" height="20" rx="3"/><rect x="118" y="292" width="14" height="20" rx="3"/>
    <rect x="188" y="292" width="14" height="20" rx="3"/><rect x="236" y="292" width="14" height="20" rx="3"/>
    <rect x="8" y="70" width="20" height="14" rx="3"/><rect x="8" y="118" width="20" height="14" rx="3"/>
    <rect x="8" y="188" width="20" height="14" rx="3"/><rect x="8" y="236" width="20" height="14" rx="3"/>
    <rect x="292" y="70" width="20" height="14" rx="3"/><rect x="292" y="118" width="20" height="14" rx="3"/>
    <rect x="292" y="188" width="20" height="14" rx="3"/><rect x="292" y="236" width="20" height="14" rx="3"/>
  </g>

  <!-- swarm: faint ghost Zs behind, suggesting parallel copies -->
  <g opacity="0.16" fill="url(#zg2)">
    <g transform="translate(150 88) scale(0.42)">
      <path d="M0 0 h96 v26 l-64 84 h64 v26 h-96 v-26 l64 -84 h-64 z"/>
    </g>
    <g transform="translate(78 150) scale(0.42)">
      <path d="M0 0 h96 v26 l-64 84 h64 v26 h-96 v-26 l64 -84 h-64 z"/>
    </g>
    <g transform="translate(150 150) scale(0.42)">
      <path d="M0 0 h96 v26 l-64 84 h64 v26 h-96 v-26 l64 -84 h-64 z"/>
    </g>
  </g>

  <!-- main pixel Z -->
  <g transform="translate(96 92)" filter="url(#glow)">
    <path d="M0 0 h128 v34 l-82 92 h82 v34 h-128 v-34 l82 -92 h-82 z" fill="url(#zg)"/>
  </g>
</svg>
